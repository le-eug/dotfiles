set-option -ga terminal-overrides ",*:Tc"
set -g default-terminal "tmux-256color"  # or "screen-256color"

# Tmux bar at top
set-option -g status-position top

# Color
set -g status-style bg=green,fg=black
# set -g status-style bg=colour235,fg=cyan
# set -g status-style bg=default,fg=default

# Sets tmux windows as 1-based
set -g base-index 1

# Rebind prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Tab to go to last active window
bind-key Tab last-window

# i dont like the right status stuff
set -g status-right ''

# Prefix indicator
set -g status-right ' #{?client_prefix,#[reverse]<leader>#[noreverse] ,}'

# Source file
bind r source-file ~/.tmux.conf

# Vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Set mouse mode
set -g mouse on

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Resize pane using keys
bind -n C-h resize-pane -L 2
bind -n C-l resize-pane -R 2
bind -n C-k resize-pane -U 1
bind -n C-j resize-pane -D 1

# New window/pane is at curr directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

